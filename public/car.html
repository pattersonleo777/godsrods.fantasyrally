<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GodsRods | Vehicle Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap');
        body { background: #050505; color: #fff; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
        .font-header { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255,255,255,0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-glow { box-shadow: 0 0 20px rgba(0, 212, 255, 0.2); border-color: #00d4ff; }
        .scanline { width: 100%; height: 2px; background: rgba(0, 212, 255, 0.1); position: absolute; animation: scan 4s linear infinite; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const CarViewer = () => {
            const [car, setCar] = useState(null);
            const [loading, setLoading] = useState(true);
            const carId = window.location.pathname.split('/').pop();

            useEffect(() => {
                fetch(`/.netlify/functions/car-webpages/${carId}`)
                    .then(res => res.json())
                    .then(data => {
                        setCar(data);
                        setLoading(false);
                    })
                    .catch(() => setLoading(false));
            }, [carId]);

            if (loading) return (
                <div className="h-screen flex items-center justify-center font-header text-cyan-500 animate-pulse">
                    LOADING_DATA_STREAM...
                </div>
            );

            if (!car) return (
                <div className="h-screen flex items-center justify-center font-header text-red-500">
                    404_VEHICLE_NOT_FOUND
                </div>
            );

            return (
                <div className="min-h-screen p-4 md:p-10">
                    <div className="max-w-6xl mx-auto">
                        <header className="mb-10 flex justify-between items-end border-b border-white/10 pb-6">
                            <div>
                                <h1 className="font-header text-4xl md:text-6xl uppercase tracking-tighter">{car.car_name}</h1>
                                <p className="text-cyan-500 tracking-widest uppercase font-bold text-sm">Owner: {car.profiles?.username || 'Unknown Pilot'}</p>
                            </div>
                            <div className="text-right hidden md:block">
                                <p className="text-xs opacity-50">REGISTRY_ID</p>
                                <p className="text-xs font-mono">{car.id}</p>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* 3D Viewport */}
                            <div className="lg:col-span-2 glass rounded-2xl relative overflow-hidden aspect-video neon-glow">
                                <div className="scanline"></div>
                                <div className="absolute inset-0 flex items-center justify-center bg-black/40">
                                    <img src={car.image_url || '/assets/images/default-car.jpg'} className="w-full h-full object-cover opacity-80" />
                                    <div className="absolute bottom-4 left-4 bg-black/80 px-4 py-2 text-xs border border-cyan-500/50">
                                        LIVE_3D_VIEWPORT_ACTIVE
                                    </div>
                                </div>
                            </div>

                            {/* Stats Panel */}
                            <div className="space-y-6">
                                <div className="glass p-6 rounded-xl border-l-4 border-cyan-500">
                                    <h3 className="font-header text-sm mb-6 opacity-70">PERFORMANCE_METRICS</h3>
                                    {Object.entries(car.stats).map(([stat, val]) => (
                                        <div key={stat} className="mb-4">
                                            <div className="flex justify-between text-xs mb-1 uppercase">
                                                <span>{stat}</span>
                                                <span className="text-cyan-400">{val}%</span>
                                            </div>
                                            <div className="h-1 w-full bg-white/5 overflow-hidden">
                                                <div className="h-full bg-cyan-500 transition-all duration-1000" style={{width: `${val}%`}}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="glass p-6 rounded-xl border-l-4 border-yellow-500">
                                    <h3 className="font-header text-sm mb-4 opacity-70">SOCIAL_ENGAGEMENT</h3>
                                    <div className="flex justify-between items-center">
                                        <span className="text-3xl font-bold">{car.views || 0}</span>
                                        <span className="text-xs opacity-50 uppercase">Total Views</span>
                                    </div>
                                    <button 
                                        onClick={() => navigator.clipboard.writeText(window.location.href)}
                                        className="mt-6 w-full py-3 bg-white text-black font-bold text-sm hover:bg-cyan-500 transition">
                                        COPY SHARE LINK
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <footer className="mt-20 text-center opacity-20 hover:opacity-100 transition">
                            <p className="font-header text-xs">GODSRODS.ONLINE // {new Date().getFullYear()}</p>
                        </footer>
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<CarViewer />);
    </script>
</body>
</html>
