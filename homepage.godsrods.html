<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GodsRods.online | Professional Racing Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&family=Inter:wght@400;500;700&display=swap');
        
        :root {
            --neon-blue: #00d4ff;
            --dirt-gold: #c5a059;
            --carbon-black: #0a0a0a;
            --track-grey: #2a2a2a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #0a0a0a; 
            color: #e0e0e0;
            background-image: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), 
                url('https://images.unsplash.com/photo-1594739433321-2679fd01111a?auto=format&fit=crop&q=80&w=2070');
            background-size: cover;
            background-attachment: fixed;
        }

        .font-header { font-family: 'Orbitron', sans-serif; }
        .font-rajdhani { font-family: 'Rajdhani', sans-serif; }

        .app-container { 
            width: 100%; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
        }

        .sparkle-gradient { 
            background: linear-gradient(90deg, #00d4ff, #c5a059, #00d4ff); 
            background-size: 200% 200%; 
            animation: grad 3s ease infinite; 
        }

        @keyframes grad { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        .glass { 
            background: rgba(20, 20, 20, 0.85); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid var(--neon-blue);
        }

        .btn-bet {
            background: var(--neon-blue);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000;
            font-weight: bold;
        }

        .btn-bet:hover {
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            transform: translateY(-2px);
        }

        .wp-section {
            padding: 2rem;
            margin: 1rem 0;
        }

        .wpcf7 {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 2rem;
        }

        .wpcf7-form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.75rem;
            border-radius: 0.375rem;
            width: 100%;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .wpcf7-submit {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.375rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                        url('https://images.unsplash.com/photo-1541443131876-44b03de101c5?auto=format&fit=crop&q=80&w=2070');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .hero-content {
            text-align: center;
            z-index: 2;
            max-width: 800px;
            padding: 2rem;
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .cta-button {
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .cta-button-primary { background: var(--neon-blue); color: #000; }
        .cta-button-secondary { background: transparent; color: #fff; border-color: var(--dirt-gold); }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-card {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .tab-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            background: var(--neon-blue);
            color: #000;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const API = 'http://localhost:8080/api';

        const GodsRodsApp = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [user, setUser] = useState(JSON.parse(localStorage.getItem('user')));
            const [reg, setReg] = useState({});
            const [log, setLog] = useState({});
            const [activeRaces, setActiveRaces] = useState([]);

            useEffect(() => {
                setActiveRaces([
                    { id: 1, type: 'Circuit', participants: 8, pot: 5000, time: '2 min' },
                    { id: 2, type: 'Drag Strip', participants: 4, pot: 2500, time: '5 min' },
                    { id: 3, type: 'Pro-Tuning', participants: 6, pot: 3500, time: '1 min' }
                ]);
            }, []);

            const syncUser = (data) => {
                localStorage.setItem('user', JSON.stringify(data));
                setUser(data);
            };

            const handleAuth = async (path, body) => {
                const res = await fetch(`${API}/auth/${path}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) { 
                    syncUser(data.user); 
                    setActiveTab('racing'); 
                } else alert(data.message);
            };

            const buyCar = async (car) => {
                const res = await fetch(`${API}/shop/buy`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: user.email, item: car })
                });
                const data = await res.json();
                if (res.ok) {
                    syncUser({...user, balance: data.balance, garage: data.garage});
                    alert(`Purchased ${car.name}!`);
                } else alert(data.message);
            };

            const HomeSection = () => (
                <div className="hero-section">
                    <div className="hero-content">
                        <h1 className="hero-title font-header sparkle-gradient bg-clip-text text-transparent">
                            GODSRODS.ONLINE
                        </h1>
                        <p className="text-xl font-rajdhani mb-8 opacity-90">Sanctioned Pro Racing & Customization</p>
                        <div className="flex gap-4 justify-center">
                            <button className="cta-button cta-button-primary" onClick={() => setActiveTab('reg')}>JOIN CIRCUIT</button>
                            <button className="cta-button cta-button-secondary" onClick={() => setActiveTab('log')}>SIGN IN</button>
                        </div>
                    </div>
                </div>
            );

            const FeaturesSection = () => (
                <div className="features-grid">
                    <div className="feature-card">
                        <i className="fas fa-stopwatch text-4xl mb-4 text-blue-400"></i>
                        <h3 className="font-header text-xl mb-2">Track Events</h3>
                        <p className="opacity-80">Compete in sanctioned circuit events and professional drag strips worldwide.</p>
                    </div>
                    <div className="feature-card">
                        <i className="fas fa-tools text-4xl mb-4 text-blue-400"></i>
                        <h3 className="font-header text-xl mb-2">Pro Customization</h3>
                        <p className="opacity-80">Tune your machine for peak aerodynamic efficiency and track performance.</p>
                    </div>
                    <div className="feature-card">
                        <i className="fas fa-medal text-4xl mb-4 text-blue-400"></i>
                        <h3 className="font-header text-xl mb-2">Championships</h3>
                        <p className="opacity-80">Official leaderboard seasons with pro-tier rewards and sponsorships.</p>
                    </div>
                </div>
            );

            return (
                <div className="app-container">
                    {activeTab !== 'home' && (
                        <header className="glass-panel p-6 flex justify-between items-center">
                            <div>
                                <h1 className="font-header text-3xl sparkle-gradient bg-clip-text text-transparent">GODSRODS</h1>
                                <p className="text-xs text-gray-400">Professional Racing League</p>
                            </div>
                            <div className="text-right">
                                <div className="text-xl font-bold text-yellow-500">${user ? user.balance.toLocaleString() : '10,000'}</div>
                                <div className="text-xs text-gray-400">Credits</div>
                                {user && (
                                    <button onClick={() => {localStorage.clear(); setUser(null); setActiveTab('home');}} className="text-xs text-red-400 hover:text-red-300 mt-1">Logout</button>
                                )}
                            </div>
                        </header>
                    )}

                    {activeTab !== 'home' && (
                        <nav className="glass p-4 flex gap-4 overflow-x-auto">
                            <button onClick={() => setActiveTab('home')} className={`tab-button uppercase text-xs font-bold ${activeTab === 'home' ? 'active' : ''}`}>HOME</button>
                            {!user ? (
                                <>
                                    <button onClick={() => setActiveTab('reg')} className={`tab-button uppercase text-xs font-bold ${activeTab === 'reg' ? 'active' : ''}`}>REGISTER</button>
                                    <button onClick={() => setActiveTab('log')} className={`tab-button uppercase text-xs font-bold ${activeTab === 'log' ? 'active' : ''}`}>LOGIN</button>
                                </>
                            ) : (
                                <>
                                    <button onClick={() => setActiveTab('racing')} className={`tab-button uppercase text-xs font-bold ${activeTab === 'racing' ? 'active' : ''}`}>RACING</button>
                                    <button onClick={() => setActiveTab('garage')} className={`tab-button uppercase text-xs font-bold ${activeTab === 'garage' ? 'active' : ''}`}>GARAGE</button>
                                    <button onClick={() => setActiveTab('shop')} className={`tab-button uppercase text-xs font-bold ${activeTab === 'shop' ? 'active' : ''}`}>SHOP</button>
                                </>
                            )}
                        </nav>
                    )}

                    <main className="flex-1">
                        {activeTab === 'home' && (
                            <div>
                                <HomeSection />
                                <FeaturesSection />
                            </div>
                        )}
                        
                        {activeTab === 'reg' && (
                            <div className="wp-section max-w-md mx-auto">
                                <h2 className="font-header text-2xl mb-6 text-center">Driver Licensing</h2>
                                <div className="wpcf7">
                                    <input className="wpcf7-form-control" placeholder="Username" onChange={e => setReg({...reg, username: e.target.value})} />
                                    <input className="wpcf7-form-control" placeholder="Email" onChange={e => setReg({...reg, email: e.target.value})} />
                                    <input className="wpcf7-form-control" type="password" placeholder="Password" onChange={e => setReg({...reg, password: e.target.value})} />
                                    <input className="wpcf7-form-control" placeholder="Team (Optional)" onChange={e => setReg({...reg, team: e.target.value})} />
                                    <button className="wpcf7-submit w-full py-3" onClick={() => handleAuth('register', reg)}>OBTAIN LICENSE</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'log' && (
                            <div className="wp-section max-w-md mx-auto">
                                <h2 className="font-header text-2xl mb-6 text-center">Driver Access</h2>
                                <div className="wpcf7">
                                    <input className="wpcf7-form-control" placeholder="Email" onChange={e => setLog({...log, email: e.target.value})} />
                                    <input className="wpcf7-form-control" type="password" placeholder="Password" onChange={e => setLog({...log, password: e.target.value})} />
                                    <button className="wpcf7-submit w-full py-3" onClick={() => handleAuth('login', log)}>SIGN IN</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'racing' && user && (
                            <div className="p-8 max-w-4xl mx-auto">
                                <h2 className="font-header text-2xl mb-6">Upcoming Track Schedule</h2>
                                <div className="grid gap-4">
                                    {activeRaces.map(race => (
                                        <div key={race.id} className="glass p-6 rounded-lg flex justify-between items-center border-l-4 border-blue-500">
                                            <div>
                                                <h3 className="font-bold text-xl">{race.type} Qualifier #{race.id}</h3>
                                                <p className="text-sm text-gray-400">{race.participants} Drivers • Prize Pool: ${race.pot}</p>
                                            </div>
                                            <button className="btn-bet px-6 py-2 rounded">Enter Heat</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'garage' && user && (
                            <div className="p-8 max-w-4xl mx-auto">
                                <h2 className="font-header text-2xl mb-6">Your Paddock</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {user.garage && user.garage.length > 0 ? user.garage.map((car, i) => (
                                        <div key={i} className="glass p-6 rounded-lg border-l-4 border-cyan-500">
                                            <h4 className="font-bold text-xl">{car.name}</h4>
                                            <p className="text-xs opacity-50">CLASS: {car.class}</p>
                                            <p className="text-xs opacity-50">Purchased: {new Date(car.purchaseDate).toLocaleDateString()}</p>
                                        </div>
                                    )) : <p className="text-gray-400 col-span-3">Your garage is empty. Visit the shop to buy cars!</p>}
                                </div>
                            </div>
                        )}

                        {activeTab === 'shop' && user && (
                            <div className="p-8 max-w-4xl mx-auto">
                                <h2 className="font-header text-2xl mb-6">Car Dealer</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {[
                                        {name: 'Interceptor X', price: 4500, class: 'S'},
                                        {name: 'Dirt Mauler', price: 3200, class: 'A'},
                                        {name: 'Neon Shadow', price: 7800, class: 'EX'}
                                    ].map((car, i) => (
                                        <div key={i} className="glass p-6 rounded-lg text-center">
                                            <h4 className="text-2xl font-header mb-2">{car.name}</h4>
                                            <div className="text-yellow-500 mb-4">${car.price}</div>
                                            <p className="text-sm mb-4">{car.class} Class</p>
                                            <button className="wpcf7-submit w-full" onClick={() => buyCar(car)} disabled={user.balance < car.price}>
                                                {user.balance >= car.price ? 'BUY NOW' : 'INSUFFICIENT FUNDS'}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="p-8 text-center text-xs opacity-50 border-t border-white/10">
                        &copy; 2026 GodsRods.online - Professional Track & Drag League.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GodsRodsApp />);
    </script>
</body>
</html>
